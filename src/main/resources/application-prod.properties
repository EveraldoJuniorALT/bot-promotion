aliexpress.app.key=${ALIEXPRESS_APP_KEY}
aliexpress.app.secret=${ALIEXPRESS_APP_SECRET}
aliexpress.api.token-base-url-sdk= https://api-sg.aliexpress.com

aliexpress.api.name-url=/auth/token/create
aliexpress.api.refresh-name-url=/auth/token/refresh
aliexpress.app.tracking-id=default

telegram.bot.name=
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.chat-id=${TELEGRAM_BOT_CHAT_ID}
telegram.bot.chat-id-priority=

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=20000

spring.jpa.open-in-view=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Appium Emulator Configuration
# To increase the number of emulators, double properties and change the index number accordingly.
# The number of emulators is related to INSTANCE_COUNT in the EnvironmentManager class
appium.emulator[0].udid=
appium.emulator[0].systemPort=
appium.emulator[0].serverUrl=

appium.emulator[1].udid=
appium.emulator[1].systemPort=
appium.emulator[1].serverUrl=